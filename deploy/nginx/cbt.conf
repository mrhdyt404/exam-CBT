# High-Concurrency NGINX Load Balancer & Reverse Proxy Configuration
# Tuned for 15,000+ Concurrent Students

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 16384;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance buffers
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    types_hash_max_size 2048;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Rate Limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/s;

    # Upstream Backend Cluster
    upstream go_backend_cluster {
        least_conn;
        server api-server:8080 max_fails=3 fail_timeout=10s;
        keepalive 256;
    }

    # Upstream Frontend Cluster
    upstream nextjs_frontend_cluster {
        least_conn;
        server frontend:3000 max_fails=3 fail_timeout=10s;
        keepalive 128;
    }

    server {
        listen 80;
        server_name _;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Frontend Next.js Pages & Static Assets
        location / {
            proxy_pass http://nextjs_frontend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Next.js Static Cache
        location /_next/static {
            proxy_pass http://nextjs_frontend_cluster;
            proxy_cache_valid 200 30d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # API Gateway Routes
        location /api/v1/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://go_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Auth Rate Limiting
        location /api/v1/auth/ {
            limit_req zone=login_limit burst=10 nodelay;
            proxy_pass http://go_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
